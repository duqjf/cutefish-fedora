# Repositórios que vêm de um fork seu, com os patches para o Fedora numa branch.
# Formato: <repositório> <branch>. Os que não estão aqui vêm de
# https://github.com/cutefishos, na branch padrão.
#
# No fork: origin = seu fork, upstream = cutefishos. Edite e commite na branch;
# "./cutefish-fedora-build.sh sync" faz rebase dela sobre o main do upstream
# (PUSH=1 envia para o fork).
FORK_BASE=https://github.com/duqjf

cutefish-compositor  fedora   # switcher: nome e ícone pelo bundle do programa (.app)
cutefish-core        fedora   # /Applications com grupo wheel (o Fedora não tem sudo)
